name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }}, ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            homeassistant: homeassistant
          - python: "3.13"
            # Home Assistant 2025.8 pins an aiodns that breaks with pycares 5.
            homeassistant: homeassistant==2025.8.* "pycares<5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt ${{ matrix.homeassistant }}
      - name: Show the Home Assistant version under test
        run: pip show homeassistant | head -2
      - name: Run tests
        run: pytest
